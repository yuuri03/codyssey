<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="노트북 앞에 앉아 있는 사람을 단순한 도형으로 그린 프로필 그림">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a5311a" />
      <stop offset="100%" stop-color="#c9552f" />
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf7" />
      <stop offset="100%" stop-color="#efe7d6" />
    </linearGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="400" height="400" rx="48" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="400" height="400" fill="url(#bg)" />

    <!-- 배경 장식 -->
    <circle cx="330" cy="70" r="90" fill="#ffffff" opacity="0.10" />
    <circle cx="60" cy="330" r="120" fill="#2b1a12" opacity="0.12" />

    <!-- 사람 -->
    <circle cx="200" cy="150" r="52" fill="#fde0c8" />
    <path d="M148 143c0-32 23-55 52-55s52 23 52 55c0-12-14-20-30-23-16-3-30 4-46 4-16 0-28 7-28 19z" fill="#241812" />
    <path d="M120 300c0-42 36-70 80-70s80 28 80 70v20H120z" fill="#3a241a" />
    <path d="M200 230c-12 0-22 10-22 22v18h44v-18c0-12-10-22-22-22z" fill="#faf6ec" opacity="0.9" />

    <!-- 노트북 -->
    <rect x="112" y="292" width="176" height="66" rx="8" fill="#2b1a12" />
    <rect x="122" y="302" width="156" height="46" rx="4" fill="url(#screen)" />
    <rect x="134" y="314" width="72" height="6" rx="3" fill="#a5311a" />
    <rect x="134" y="326" width="104" height="6" rx="3" fill="#a8937f" />
    <rect x="134" y="338" width="52" height="6" rx="3" fill="#a8937f" />
    <rect x="96" y="356" width="208" height="12" rx="6" fill="#1a0f09" opacity="0.85" />
  </g>
</svg>
