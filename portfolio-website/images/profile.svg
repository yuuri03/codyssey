<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-labelledby="profileTitle profileDesc">
  <title id="profileTitle">공윤경 프로필 일러스트</title>
  <desc id="profileDesc">일자 앞머리에 긴 검은 생머리를 하고 흰 셔츠를 입은 사람을 벽돌빛 배경 위에 단순한 도형으로 그린 그림입니다.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a5311a" />
      <stop offset="100%" stop-color="#c9552f" />
    </linearGradient>
    <linearGradient id="hair" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#2b1c14" />
      <stop offset="100%" stop-color="#1c110b" />
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf7" />
      <stop offset="100%" stop-color="#f0e8d8" />
    </linearGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="400" height="400" rx="48" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="400" height="400" fill="url(#bg)" />

    <!-- 배경 장식 -->
    <circle cx="332" cy="72" r="92" fill="#faf8ef" opacity="0.1" />
    <circle cx="58" cy="344" r="118" fill="#1a0f09" opacity="0.14" />

    <!-- 뒤로 흐르는 머리 전체 -->
    <path d="M200 56c62 0 93 47 95 104 3 60 6 120 10 180 2 32-4 52-12 60H107c-8-8-14-28-12-60 4-60 7-120 10-180 2-57 33-104 95-104z"
          fill="url(#hair)" />

    <!-- 목 (셔츠 아래까지 내려 틈이 보이지 않게 한다) -->
    <path d="M182 206h36v100h-36z" fill="#e9c3a6" />
    <path d="M182 206h36v26a52 52 0 0 1-36 0z" fill="#dcb193" />

    <!-- 어깨와 셔츠 -->
    <path d="M200 296c-52 0-88 32-98 104h196c-10-72-46-104-98-104z" fill="url(#shirt)" />
    <path d="M200 332 172 298l16-6 12 22 12-22 16 6z" fill="#e6dcc7" />
    <path d="M200 314v86" stroke="#ddd2ba" stroke-width="3" stroke-linecap="round" />

    <!-- 얼굴 -->
    <path d="M200 94c36 0 58 25 58 64 0 40-22 76-58 82-36-6-58-42-58-82 0-39 22-64 58-64z" fill="#f6d9c3" />

    <!-- 볼 -->
    <ellipse cx="165" cy="196" rx="12" ry="7" fill="#e8917a" opacity="0.32" />
    <ellipse cx="235" cy="196" rx="12" ry="7" fill="#e8917a" opacity="0.32" />

    <!-- 눈썹 -->
    <path d="M164 157c8-6 22-6 29-1" fill="none" stroke="#241812" stroke-width="4" stroke-linecap="round" />
    <path d="M207 156c7-5 21-5 29 1" fill="none" stroke="#241812" stroke-width="4" stroke-linecap="round" />

    <!-- 눈 -->
    <ellipse cx="178" cy="176" rx="7.5" ry="9" fill="#241812" />
    <ellipse cx="222" cy="176" rx="7.5" ry="9" fill="#241812" />
    <circle cx="180.5" cy="172.5" r="2.6" fill="#fffdf7" opacity="0.92" />
    <circle cx="224.5" cy="172.5" r="2.6" fill="#fffdf7" opacity="0.92" />

    <!-- 코와 입 -->
    <path d="M201 188c3 6 2 10-3 11" fill="none" stroke="#dca783" stroke-width="2.6" stroke-linecap="round" />
    <path d="M189 210c6 7 16 7 22 0" fill="none" stroke="#b4584c" stroke-width="3.2" stroke-linecap="round" />

    <!-- 일자 앞머리 -->
    <path d="M200 82c41 0 63 28 63 74-7-8-21-12-35-10-10 2-19 5-28 5s-18-3-28-5c-14-2-28 2-35 10 0-46 22-74 63-74z"
          fill="url(#hair)" />

    <!-- 얼굴 옆으로 흘러내린 머리 -->
    <path d="M140 138c-10 60-17 122-13 192 2 32 0 56-4 70H94c-6-30-3-84 3-139 6-60 17-104 26-128z" fill="url(#hair)" />
    <path d="M260 138c10 60 17 122 13 192-2 32 0 56 4 70h29c6-30 3-84-3-139-6-60-17-104-26-128z" fill="url(#hair)" />

    <!-- 머릿결 빛. 얼굴 옆이 아니라 바깥쪽 머리 위에 둬야 따로 난 가닥으로 보이지 않는다 -->
    <path d="M283 168c9 44 12 108 10 172" fill="none" stroke="#4d3224" stroke-width="8" stroke-linecap="round" opacity="0.32" />
    <path d="M117 170c-8 44-11 106-9 170" fill="none" stroke="#4d3224" stroke-width="6" stroke-linecap="round" opacity="0.22" />
  </g>
</svg>
